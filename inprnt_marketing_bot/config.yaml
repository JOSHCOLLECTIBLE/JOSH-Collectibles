# ==============================================================================
# THE JOSH¹ ARCHIVE - PHYGITAL ART MARKETING & CURATION CONFIGURATION
# ==============================================================================
# Configured specifically for JOSH SHOOT (Joshua den Ouden)
# Bridging Solana blockchain provenance (JOSHSHOOT.SOL) & physical INPRNT prints.

artist:
  name: "JOSH SHOOT"
  full_name: "Joshua den Ouden"
  domain: "joshuadenouden21-hiuos.wordpress.com"
  solana_domain: "JOSHSHOOT.SOL"
  drip_url: "https://drip.haus/josh"
  twitter_handle: "@Joshtakesphoto"
  instagram_handle: "@joshuadenouden"
  location: "Cairo, Egypt"
  profile_url: "https://www.inprnt.com/profile/joshuadenouden/"
  gallery_url: "https://www.inprnt.com/gallery/joshuadenouden/"
  bio: "Creator of The JOSH Archive. On-chain Photography & Phygital Fine Art. Bridging Solana Blockchain provenance and Gallery-Quality physical prints."
  default_device: "iPhone 12 / Archival Capture"
  default_rarity: "Common"

promotion:
  tone: "joshshoot_archive"  # Clean, authoritative JOSH¹ Archive curatorial metadata tone
  start_from_number: 197           # Start sequential focus from JOSH1-#197 downwards to #1
  sequence_direction: "descending" # "descending" (197 -> 1) or "ascending" (199 -> 222)
  default_discount_note: "Exclusively Available as a Limited Edition Phygital Art piece ($12.00)"
  call_to_action: "Collect the archive & explore global shipping via INPRNT [joshuadenouden21-hiuos.wordpress.com]"
  
  hashtags:
    pinterest:
      - "#PhygitalArt"
      - "#SolanaNFT"
      - "#Industrial"
      - "#BrutalistArchitecture"
      - "#ArchitecturalPhotography"
      - "#FineArtPrint"
      - "#JOSHSHOOTPRINTS"
      - "#WallArtDecor"
      - "#INPRNT"
      - "#ArtCollector"
    twitter_bluesky:
      - "#PhygitalArt"
      - "#SolanaNFT"
      - "#Industrial"
      - "#SolanaArt"
      - "#INPRNT"
      - "#ArtCollector"
    instagram:
      - "#PhygitalArt"
      - "#Industrial"
      - "#SolanaNFT"
      - "#joshshoot"
      - "#joshshoot_sol"
      - "#inprnt"
      - "#fineartphotography"
      - "#architecturalphotography"
      - "#brutalistarchitecture"
      - "#onchainart"
      - "#solanaart"
      - "#contemporarycollector"
      - "#archivalprint"
      - "#urbangeometry"
      - "#artcurator"

  channels_enabled:
    - "pinterest"
    - "twitter_bluesky"
    - "instagram"
    - "github_journal"

instagram_automation:
  enabled: true
  # Official Meta Graph API (requires INSTAGRAM_ACCESS_TOKEN and INSTAGRAM_ACCOUNT_ID in GitHub secrets)
  method: "graph_api"

output:
  directory: "output"
  history_file: "output/history.json"
  save_json: true
  save_markdown: true
  save_html_report: true
  save_pinterest_csv: true
